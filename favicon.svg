<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="marineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4f6c"/>
      <stop offset="100%" stop-color="#073245"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d49b57"/>
      <stop offset="50%" stop-color="#b4793e"/>
      <stop offset="100%" stop-color="#8c5825"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#16171a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Shield/Pebble -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#f9f8f5" stroke="#e4ded2" stroke-width="2"/>

  <!-- Geometric Water Droplet & Heating Crest -->
  <g filter="url(#subtleShadow)">
    <!-- Primary Water Drop (Left/Center) -->
    <path d="M32 10 C32 10 18 26 18 37 C18 45 24.3 51 32 51 C32 51 32 30 32 10 Z" fill="url(#marineGrad)"/>
    
    <!-- Warm Artisan Flame Element (Right/Center) -->
    <path d="M32 10 C32 30 32 51 32 51 C39.7 51 46 45 46 37 C46 26 32 10 32 10 Z" fill="url(#brassGrad)"/>

    <!-- Subtle Inner Geometry Notch (Precision Cut) -->
    <circle cx="32" cy="38" r="5" fill="#f9f8f5"/>
    <circle cx="32" cy="38" r="2.5" fill="url(#marineGrad)"/>
  </g>
</svg>
